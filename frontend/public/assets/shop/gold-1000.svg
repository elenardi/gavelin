<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a0e00"/>
      <stop offset="100%" stop-color="#060300"/>
    </radialGradient>
    <radialGradient id="coin" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <filter id="f"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- Glow -->
  <circle cx="100" cy="95" r="60" fill="#f59e0b" opacity="0.12" filter="url(#f)"/>
  <!-- Coin stack (back) -->
  <ellipse cx="100" cy="140" rx="50" ry="14" fill="#b45309"/>
  <ellipse cx="100" cy="130" rx="50" ry="14" fill="#d97706"/>
  <ellipse cx="100" cy="120" rx="50" ry="14" fill="#b45309"/>
  <ellipse cx="100" cy="110" rx="50" ry="14" fill="#d97706"/>
  <!-- Front coin (big) -->
  <ellipse cx="100" cy="95" rx="56" ry="16" fill="#b45309"/>
  <ellipse cx="100" cy="88" rx="56" ry="16" fill="url(#coin)"/>
  <ellipse cx="100" cy="88" rx="44" ry="11" fill="#fde68a" opacity="0.3"/>
  <!-- G symbol on coin -->
  <text x="100" y="94" font-family="Georgia,serif" font-size="18" font-weight="bold" fill="#92400e" text-anchor="middle">G</text>
  <!-- Scattered coins -->
  <ellipse cx="38" cy="145" rx="16" ry="5" fill="#b45309"/>
  <ellipse cx="38" cy="142" rx="16" ry="5" fill="url(#coin)"/>
  <ellipse cx="162" cy="148" rx="14" ry="4" fill="#b45309"/>
  <ellipse cx="162" cy="145" rx="14" ry="4" fill="#f59e0b"/>
  <!-- Sparkles -->
  <text x="150" y="50" font-size="14" fill="#fde68a" filter="url(#f)" opacity="0.9">✦</text>
  <text x="35" y="70" font-size="10" fill="#f59e0b" filter="url(#f)" opacity="0.8">✦</text>
  <text x="165" y="80" font-size="12" fill="#fde68a" filter="url(#f)" opacity="0.7">✦</text>
  <!-- Label -->
  <rect x="50" y="155" width="100" height="32" rx="16" fill="#92400e" opacity="0.9"/>
  <text x="100" y="166" font-family="Arial,sans-serif" font-size="10" fill="#fde68a" text-anchor="middle">GOLD</text>
  <text x="100" y="181" font-family="Georgia,serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">x 1000</text>
</svg>
