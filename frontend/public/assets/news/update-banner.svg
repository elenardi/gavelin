<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1a2e"/>
      <stop offset="100%" stop-color="#0d2a3d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <filter id="f"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="600" height="200" fill="url(#bg)"/>
  <rect width="600" height="200" fill="url(#glow)"/>

  <!-- Grid lines (tech feel) -->
  <line x1="0" y1="50" x2="600" y2="50" stroke="#0ea5e9" stroke-width="0.5" opacity="0.15"/>
  <line x1="0" y1="100" x2="600" y2="100" stroke="#0ea5e9" stroke-width="0.5" opacity="0.15"/>
  <line x1="0" y1="150" x2="600" y2="150" stroke="#0ea5e9" stroke-width="0.5" opacity="0.15"/>
  <line x1="150" y1="0" x2="150" y2="200" stroke="#0ea5e9" stroke-width="0.5" opacity="0.1"/>
  <line x1="300" y1="0" x2="300" y2="200" stroke="#0ea5e9" stroke-width="0.5" opacity="0.1"/>
  <line x1="450" y1="0" x2="450" y2="200" stroke="#0ea5e9" stroke-width="0.5" opacity="0.1"/>

  <!-- Chibi knight character on left -->
  <!-- Body / armor -->
  <path d="M 55 155 Q 45 135 48 115 Q 95 104 142 115 Q 145 135 135 155 Z" fill="#1e3a5f"/>
  <path d="M 55 155 L 40 190 L 155 190 L 140 155 Z" fill="#162d4a"/>
  <!-- Armor shine -->
  <path d="M 70 125 Q 95 120 120 125" stroke="#60a5fa" stroke-width="2" fill="none" opacity="0.5"/>
  <!-- Shield -->
  <path d="M 148 120 Q 172 110 172 140 Q 172 162 148 170 Q 124 162 124 140 Q 124 110 148 120 Z" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1.5"/>
  <path d="M 148 128 L 148 162" stroke="#60a5fa" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 136 145 L 160 145" stroke="#60a5fa" stroke-width="1.5" fill="none" opacity="0.6"/>
  <!-- Arms -->
  <path d="M 48 122 Q 22 130 18 148" stroke="#f5c9a0" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- Head -->
  <ellipse cx="95" cy="88" rx="46" ry="43" fill="#f5c9a0"/>
  <!-- Helmet -->
  <path d="M 52 80 Q 54 46 70 32 Q 95 18 120 32 Q 136 46 138 80 Z" fill="#1e3a5f"/>
  <path d="M 62 80 Q 95 68 128 80" stroke="#60a5fa" stroke-width="1.5" fill="none" opacity="0.6"/>
  <!-- Visor opening -->
  <rect x="72" y="76" width="46" height="18" rx="4" fill="#0a1a2e" opacity="0.8"/>
  <!-- Eyes through visor -->
  <ellipse cx="83" cy="85" rx="7" ry="7" fill="white"/>
  <ellipse cx="83" cy="86" rx="5" ry="5" fill="#0ea5e9"/>
  <circle cx="82" cy="84" r="2.5" fill="#051525"/>
  <circle cx="80" cy="83" r="1.2" fill="white"/>
  <ellipse cx="107" cy="85" rx="7" ry="7" fill="white"/>
  <ellipse cx="107" cy="86" rx="5" ry="5" fill="#0ea5e9"/>
  <circle cx="106" cy="84" r="2.5" fill="#051525"/>
  <circle cx="104" cy="83" r="1.2" fill="white"/>
  <!-- Plume on helmet -->
  <path d="M 95 18 Q 85 5 78 12 Q 90 15 95 22 Q 100 15 112 12 Q 105 5 95 18" fill="#ef4444" opacity="0.9"/>

  <!-- Floating upgrade icons -->
  <text x="490" y="50" font-size="22" fill="#f0d060" filter="url(#f)" opacity="0.8">⚔️</text>
  <text x="530" y="90" font-size="18" fill="#0ea5e9" filter="url(#f)" opacity="0.8">🛡️</text>
  <text x="500" y="130" font-size="20" fill="#a855f7" filter="url(#f)" opacity="0.8">✦</text>
  <text x="555" y="55" font-size="14" fill="#22c55e" filter="url(#f)" opacity="0.7">✦</text>

  <!-- Text -->
  <text x="195" y="62" font-family="Georgia,serif" font-size="28" font-weight="bold" fill="white">Update v1.2</text>
  <text x="195" y="86" font-family="Georgia,serif" font-size="13" fill="#7dd3fc">Fitur Baru &amp; Perbaikan</text>
  <line x1="195" y1="98" x2="560" y2="98" stroke="#0ea5e9" stroke-width="1" opacity="0.4"/>
  <text x="195" y="118" font-family="Arial,sans-serif" font-size="12" fill="#bae6fd">• Slot pack kini pulih otomatis setiap 12 jam</text>
  <text x="195" y="136" font-family="Arial,sans-serif" font-size="12" fill="#bae6fd">• Buka pack dengan Gold atau Gems</text>
  <text x="195" y="154" font-family="Arial,sans-serif" font-size="12" fill="#bae6fd">• Tampilan Home baru yang lebih segar</text>
  <text x="195" y="172" font-family="Arial,sans-serif" font-size="12" fill="#bae6fd">• Halaman Pack &amp; koleksi kartu diperbaiki</text>
</svg>
