<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2d1b4e"/>
      <stop offset="100%" stop-color="#0a0515"/>
    </radialGradient>
    <radialGradient id="torch" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9a3c" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeL" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ff3a3a"/>
      <stop offset="100%" stop-color="#8b0000"/>
    </radialGradient>
    <radialGradient id="eyeR" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ff3a3a"/>
      <stop offset="100%" stop-color="#8b0000"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="420" fill="url(#bg)"/>

  <!-- Stone wall texture -->
  <rect x="0" y="0" width="300" height="420" fill="none" stroke="#1a0d2e" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="80" x2="300" y2="80" stroke="#1a0d2e" stroke-width="1.5" opacity="0.4"/>
  <line x1="0" y1="160" x2="300" y2="160" stroke="#1a0d2e" stroke-width="1.5" opacity="0.4"/>
  <line x1="0" y1="240" x2="300" y2="240" stroke="#1a0d2e" stroke-width="1.5" opacity="0.4"/>
  <line x1="75" y1="0" x2="75" y2="80" stroke="#1a0d2e" stroke-width="1" opacity="0.3"/>
  <line x1="150" y1="80" x2="150" y2="160" stroke="#1a0d2e" stroke-width="1" opacity="0.3"/>
  <line x1="100" y1="160" x2="100" y2="240" stroke="#1a0d2e" stroke-width="1" opacity="0.3"/>
  <line x1="200" y1="240" x2="200" y2="300" stroke="#1a0d2e" stroke-width="1" opacity="0.3"/>

  <!-- Torch glow -->
  <ellipse cx="150" cy="200" rx="120" ry="100" fill="url(#torch)"/>

  <!-- Torch -->
  <rect x="143" y="280" width="14" height="55" rx="4" fill="#5c3a1e"/>
  <ellipse cx="150" cy="278" rx="12" ry="10" fill="#ff6a00"/>
  <ellipse cx="150" cy="272" rx="9" ry="8" fill="#ffb347"/>
  <ellipse cx="150" cy="267" rx="6" ry="6" fill="#fff0a0"/>

  <!-- Goblin body -->
  <ellipse cx="150" cy="300" rx="52" ry="48" fill="#3d7a3d" filter="url(#shadow)"/>
  <!-- Goblin armor vest -->
  <path d="M 110 280 Q 150 270 190 280 L 195 330 Q 150 345 105 330 Z" fill="#2a4a2a"/>
  <!-- Armor rivets -->
  <circle cx="130" cy="295" r="4" fill="#8b7355"/>
  <circle cx="170" cy="295" r="4" fill="#8b7355"/>
  <circle cx="150" cy="315" r="4" fill="#8b7355"/>

  <!-- Goblin head -->
  <ellipse cx="150" cy="195" rx="70" ry="65" fill="#4a9a4a" filter="url(#shadow)"/>

  <!-- Big goblin ears -->
  <ellipse cx="82" cy="195" rx="20" ry="30" fill="#3d7a3d" transform="rotate(-15 82 195)"/>
  <ellipse cx="82" cy="195" rx="12" ry="20" fill="#5ab85a" transform="rotate(-15 82 195)"/>
  <ellipse cx="218" cy="195" rx="20" ry="30" fill="#3d7a3d" transform="rotate(15 218 195)"/>
  <ellipse cx="218" cy="195" rx="12" ry="20" fill="#5ab85a" transform="rotate(15 218 195)"/>

  <!-- Goblin eyes -->
  <ellipse cx="122" cy="188" rx="20" ry="22" fill="white"/>
  <ellipse cx="122" cy="191" rx="14" ry="16" fill="url(#eyeL)"/>
  <circle cx="119" cy="188" r="7" fill="#1a0000"/>
  <circle cx="115" cy="184" r="3.5" fill="white"/>
  <ellipse cx="178" cy="188" rx="20" ry="22" fill="white"/>
  <ellipse cx="178" cy="191" rx="14" ry="16" fill="url(#eyeR)"/>
  <circle cx="175" cy="188" r="7" fill="#1a0000"/>
  <circle cx="171" cy="184" r="3.5" fill="white"/>

  <!-- Eyebrows (angry/sneaky) -->
  <path d="M 103 172 L 132 178" stroke="#2a5a2a" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 168 178 L 197 172" stroke="#2a5a2a" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Goblin nose -->
  <ellipse cx="150" cy="207" rx="10" ry="7" fill="#3d7a3d"/>
  <circle cx="145" cy="207" r="4" fill="#2d6a2d"/>
  <circle cx="155" cy="207" r="4" fill="#2d6a2d"/>

  <!-- Goblin sly mouth -->
  <path d="M 130 225 Q 150 240 170 225" stroke="#2a5a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 130 225 Q 127 220 133 218" stroke="#2a5a2a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 170 225 Q 173 220 167 218" stroke="#2a5a2a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Teeth -->
  <rect x="140" y="226" width="8" height="8" rx="2" fill="white" opacity="0.9"/>
  <rect x="152" y="226" width="8" height="8" rx="2" fill="white" opacity="0.9"/>

  <!-- Blush -->
  <ellipse cx="100" cy="212" rx="18" ry="10" fill="rgba(180,80,80,0.3)"/>
  <ellipse cx="200" cy="212" rx="18" ry="10" fill="rgba(180,80,80,0.3)"/>

  <!-- Hat / Cap -->
  <ellipse cx="150" cy="138" rx="70" ry="15" fill="#2a4a2a"/>
  <path d="M 100 138 Q 90 100 120 80 Q 150 65 180 80 Q 210 100 200 138 Z" fill="#1a3a1a"/>
  <path d="M 120 80 Q 150 55 180 80" stroke="#4a8a4a" stroke-width="2" fill="none"/>

  <!-- Stars on hat -->
  <text x="138" y="108" font-size="16" fill="#f0d060" filter="url(#glow)">✦</text>
  <text x="152" y="100" font-size="10" fill="#f0d060" opacity="0.7">✦</text>

  <!-- Bottom label area -->
  <rect x="0" y="360" width="300" height="60" fill="rgba(0,0,0,0.7)"/>
  <rect x="0" y="358" width="300" height="3" fill="#7c3aed"/>

  <!-- Pack name -->
  <text x="150" y="387" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">Dungeon Depths</text>
  <text x="150" y="406" font-family="Arial, sans-serif" font-size="11" fill="#c084fc" text-anchor="middle" letter-spacing="2">GAVELIN CARD CHRONICLES</text>

  <!-- Corner ornaments -->
  <text x="12" y="28" font-size="18" fill="#7c3aed" opacity="0.7">⚔</text>
  <text x="272" y="28" font-size="18" fill="#7c3aed" opacity="0.7">⚔</text>
</svg>
