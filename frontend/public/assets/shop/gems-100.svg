<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0d1a3d"/>
      <stop offset="100%" stop-color="#020508"/>
    </radialGradient>
    <radialGradient id="gem" cx="35%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="40%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
    <filter id="f"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- Glow -->
  <circle cx="100" cy="90" r="65" fill="#0ea5e9" opacity="0.1" filter="url(#f)"/>
  <!-- Big gem center -->
  <polygon points="100,30 140,60 140,110 100,135 60,110 60,60" fill="url(#gem)"/>
  <polygon points="100,30 140,60 100,70 60,60" fill="#a5f3fc" opacity="0.4"/>
  <polygon points="60,60 100,70 100,135 60,110" fill="#0369a1" opacity="0.4"/>
  <polygon points="140,60 100,70 100,135 140,110" fill="#075985" opacity="0.5"/>
  <line x1="100" y1="30" x2="100" y2="135" stroke="white" stroke-width="0.5" opacity="0.3"/>
  <!-- Small gems scattered -->
  <polygon points="30,140 45,150 45,165 30,172 15,165 15,150" fill="#67e8f9" opacity="0.7" transform="scale(0.6) translate(28,90)"/>
  <polygon points="155,130 168,140 168,153 155,160 142,153 142,140" fill="#38bdf8" opacity="0.7" transform="scale(0.55) translate(130,80)"/>
  <polygon points="50,155 60,163 60,174 50,180 40,174 40,163" fill="#7dd3fc" opacity="0.6" transform="scale(0.5) translate(60,100)"/>
  <!-- Sparkles -->
  <text x="155" y="55" font-size="14" fill="#a5f3fc" filter="url(#f)" opacity="0.9">✦</text>
  <text x="30" y="75" font-size="10" fill="#7dd3fc" filter="url(#f)" opacity="0.8">✦</text>
  <text x="165" y="90" font-size="12" fill="#e0f2fe" filter="url(#f)" opacity="0.7">✦</text>
  <!-- Label -->
  <rect x="50" y="148" width="100" height="32" rx="16" fill="#0369a1" opacity="0.8"/>
  <text x="100" y="159" font-family="Arial,sans-serif" font-size="10" fill="#7dd3fc" text-anchor="middle">GEMS</text>
  <text x="100" y="174" font-family="Georgia,serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">x 100</text>
</svg>
