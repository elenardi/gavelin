<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0514"/>
      <stop offset="100%" stop-color="#1a0d3d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0d060"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0d060"/>
    </linearGradient>
    <filter id="f"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="200" height="120" fill="url(#bg)"/>
  <rect x="4" y="4" width="192" height="112" rx="10" fill="none" stroke="#f0d060" stroke-width="2"/>
  <!-- Corner crowns -->
  <text x="10" y="32" font-size="18" filter="url(#f)">👑</text>
  <text x="164" y="32" font-size="18" filter="url(#f)">👑</text>
  <!-- Title text -->
  <text x="100" y="42" font-family="Georgia,serif" font-size="13" fill="#c084fc" text-anchor="middle" letter-spacing="3" opacity="0.8">TITLE</text>
  <text x="100" y="73" font-family="Georgia,serif" font-size="22" font-weight="bold" fill="url(#gold)" text-anchor="middle" letter-spacing="1" filter="url(#f)">Dungeon Lord</text>
  <line x1="30" y1="82" x2="170" y2="82" stroke="#f0d060" stroke-width="1" opacity="0.5"/>
  <text x="100" y="100" font-family="Arial,sans-serif" font-size="10" fill="#d4a000" text-anchor="middle" letter-spacing="2">GAVELIN</text>
</svg>
