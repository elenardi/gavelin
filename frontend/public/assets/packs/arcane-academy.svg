<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1a0d4a"/>
      <stop offset="100%" stop-color="#05020f"/>
    </radialGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eye" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </radialGradient>
    <radialGradient id="skin" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffe8d6"/>
      <stop offset="100%" stop-color="#f5c9a0"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="sh"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6d28d9" flood-opacity="0.5"/></filter>
  </defs>

  <rect width="300" height="420" fill="url(#bg)"/>

  <!-- Stars -->
  <circle cx="30" cy="30" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="80" cy="15" r="1" fill="white" opacity="0.6"/>
  <circle cx="140" cy="25" r="2" fill="white" opacity="0.9"/>
  <circle cx="200" cy="12" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="260" cy="35" r="1" fill="white" opacity="0.5"/>
  <circle cx="20" cy="70" r="1" fill="white" opacity="0.6"/>
  <circle cx="270" cy="65" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="50" cy="320" r="1" fill="white" opacity="0.5"/>
  <circle cx="260" cy="310" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="35" cy="200" r="1" fill="#c084fc" opacity="0.7"/>
  <circle cx="265" cy="190" r="1" fill="#c084fc" opacity="0.7"/>

  <!-- Magic circle on ground -->
  <circle cx="150" cy="340" r="70" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.5"/>
  <circle cx="150" cy="340" r="55" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.4"/>
  <circle cx="150" cy="340" r="40" fill="none" stroke="#c084fc" stroke-width="0.8" opacity="0.3"/>
  <!-- Rune marks -->
  <text x="150" y="278" font-size="10" fill="#c084fc" text-anchor="middle" opacity="0.6">✦</text>
  <text x="220" y="344" font-size="10" fill="#c084fc" text-anchor="middle" opacity="0.6">✦</text>
  <text x="80" y="344" font-size="10" fill="#c084fc" text-anchor="middle" opacity="0.6">✦</text>
  <text x="150" y="410" font-size="10" fill="#c084fc" text-anchor="middle" opacity="0.4">✦</text>

  <!-- Floating sparkles -->
  <text x="55" y="185" font-size="14" fill="#f0d060" filter="url(#glow)" opacity="0.8">✦</text>
  <text x="235" y="175" font-size="12" fill="#c084fc" filter="url(#glow)" opacity="0.8">✦</text>
  <text x="70" y="250" font-size="10" fill="#60a5fa" filter="url(#glow)" opacity="0.7">✦</text>
  <text x="225" y="255" font-size="10" fill="#f0d060" filter="url(#glow)" opacity="0.7">✦</text>

  <!-- Orb glow -->
  <ellipse cx="150" cy="210" rx="110" ry="100" fill="url(#orb)"/>

  <!-- Robe / body -->
  <path d="M 105 310 Q 90 280 95 255 Q 150 240 205 255 Q 210 280 195 310 Z" fill="#3b1f72"/>
  <path d="M 105 310 L 85 360 L 215 360 L 195 310 Z" fill="#2d1760"/>
  <!-- Robe star pattern -->
  <text x="140" y="300" font-size="10" fill="#c084fc" opacity="0.5">✦</text>
  <text x="158" y="318" font-size="8" fill="#c084fc" opacity="0.4">✦</text>
  <!-- Robe belt -->
  <rect x="112" y="270" width="76" height="10" rx="5" fill="#f0d060" opacity="0.8"/>

  <!-- Arms holding staff -->
  <path d="M 95 270 Q 65 285 58 310 Q 62 295 70 285" stroke="#f5c9a0" stroke-width="16" fill="none" stroke-linecap="round"/>
  <path d="M 205 270 Q 235 285 242 310 Q 238 295 230 285" stroke="#f5c9a0" stroke-width="16" fill="none" stroke-linecap="round"/>

  <!-- Staff -->
  <rect x="230" y="140" width="8" height="175" rx="4" fill="#5c3a1e"/>
  <circle cx="234" cy="135" r="18" fill="#2d1760" stroke="#a855f7" stroke-width="2"/>
  <circle cx="234" cy="135" r="12" fill="#7c3aed"/>
  <circle cx="234" cy="135" r="7" fill="#c084fc"/>
  <circle cx="234" cy="135" r="3" fill="white" opacity="0.9"/>
  <ellipse cx="234" cy="135" rx="18" ry="18" fill="none" stroke="#f0d060" stroke-width="1" opacity="0.5"/>

  <!-- Head -->
  <ellipse cx="150" cy="195" rx="68" ry="65" fill="url(#skin)" filter="url(#sh)"/>

  <!-- Silver hair -->
  <path d="M 85 185 Q 82 130 110 110 Q 150 90 190 110 Q 218 130 215 185" fill="#d0d8f0"/>
  <path d="M 85 185 Q 70 200 75 230 Q 80 215 88 205" fill="#d0d8f0"/>
  <path d="M 215 185 Q 230 200 225 230 Q 220 215 212 205" fill="#d0d8f0"/>
  <!-- Hair shine -->
  <path d="M 115 115 Q 130 95 150 90" stroke="white" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>

  <!-- Wizard hat base -->
  <ellipse cx="150" cy="138" rx="72" ry="18" fill="#2d1760"/>
  <!-- Hat cone -->
  <path d="M 82 140 Q 95 80 130 50 Q 150 30 170 50 Q 205 80 218 140 Z" fill="#3b1f72"/>
  <!-- Hat stripe -->
  <path d="M 95 115 Q 150 105 205 115" stroke="#f0d060" stroke-width="2" fill="none" opacity="0.7"/>
  <!-- Hat star -->
  <text x="142" y="88" font-size="20" fill="#f0d060" filter="url(#glow)">★</text>

  <!-- Eyes -->
  <ellipse cx="122" cy="192" rx="20" ry="22" fill="white"/>
  <ellipse cx="122" cy="195" rx="14" ry="16" fill="url(#eye)"/>
  <circle cx="119" cy="192" r="7" fill="#1a0030"/>
  <circle cx="115" cy="188" r="3.5" fill="white"/>
  <ellipse cx="178" cy="192" rx="20" ry="22" fill="white"/>
  <ellipse cx="178" cy="195" rx="14" ry="16" fill="url(#eye)"/>
  <circle cx="175" cy="192" r="7" fill="#1a0030"/>
  <circle cx="171" cy="188" r="3.5" fill="white"/>

  <!-- Eyebrows -->
  <path d="M 105 178 Q 118 173 132 177" stroke="#8b7aa8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 168 177 Q 182 173 195 178" stroke="#8b7aa8" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Nose -->
  <ellipse cx="150" cy="211" rx="7" ry="5" fill="#e8b896" opacity="0.7"/>

  <!-- Smile -->
  <path d="M 133 226 Q 150 240 167 226" stroke="#c8907a" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Blush -->
  <ellipse cx="100" cy="210" rx="17" ry="9" fill="rgba(255,160,140,0.4)"/>
  <ellipse cx="200" cy="210" rx="17" ry="9" fill="rgba(255,160,140,0.4)"/>

  <!-- Floating magic orbs -->
  <circle cx="68" cy="230" r="8" fill="#a855f7" opacity="0.7" filter="url(#glow)"/>
  <circle cx="68" cy="230" r="4" fill="white" opacity="0.6"/>
  <circle cx="232" cy="225" r="6" fill="#60a5fa" opacity="0.7" filter="url(#glow)"/>
  <circle cx="232" cy="225" r="3" fill="white" opacity="0.6"/>

  <!-- Bottom label -->
  <rect x="0" y="360" width="300" height="60" fill="rgba(0,0,0,0.75)"/>
  <rect x="0" y="358" width="300" height="3" fill="#a855f7"/>
  <text x="150" y="387" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">Arcane Academy</text>
  <text x="150" y="406" font-family="Arial, sans-serif" font-size="11" fill="#c084fc" text-anchor="middle" letter-spacing="2">GAVELIN CARD CHRONICLES</text>

  <text x="12" y="28" font-size="16" fill="#c084fc" opacity="0.8">✦</text>
  <text x="274" y="28" font-size="16" fill="#c084fc" opacity="0.8">✦</text>
</svg>
