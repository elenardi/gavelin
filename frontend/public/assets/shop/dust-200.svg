<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a0d2e"/>
      <stop offset="100%" stop-color="#05020a"/>
    </radialGradient>
    <radialGradient id="orb" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </radialGradient>
    <filter id="f"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- Ambient glow -->
  <circle cx="100" cy="88" r="55" fill="#a855f7" opacity="0.15" filter="url(#soft)"/>
  <!-- Floating dust particles -->
  <circle cx="55" cy="60" r="4" fill="#c084fc" opacity="0.8" filter="url(#f)"/>
  <circle cx="148" cy="55" r="3" fill="#e879f9" opacity="0.7" filter="url(#f)"/>
  <circle cx="40" cy="100" r="2.5" fill="#c084fc" opacity="0.6" filter="url(#f)"/>
  <circle cx="165" cy="90" r="3.5" fill="#a855f7" opacity="0.7" filter="url(#f)"/>
  <circle cx="70" cy="40" r="2" fill="#e9d5ff" opacity="0.6" filter="url(#f)"/>
  <circle cx="135" cy="38" r="2.5" fill="#d8b4fe" opacity="0.6" filter="url(#f)"/>
  <circle cx="160" cy="120" r="2" fill="#c084fc" opacity="0.5" filter="url(#f)"/>
  <circle cx="42" cy="130" r="3" fill="#a855f7" opacity="0.5" filter="url(#f)"/>
  <!-- Central vial / pouch shape -->
  <path d="M 80 55 L 75 70 Q 55 90 58 115 Q 60 140 100 148 Q 140 140 142 115 Q 145 90 125 70 L 120 55 Z" fill="#2d1760" stroke="#a855f7" stroke-width="1.5"/>
  <path d="M 82 55 L 118 55" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  <!-- Dust swirl inside vial -->
  <ellipse cx="100" cy="108" rx="30" ry="28" fill="url(#orb)" opacity="0.6"/>
  <ellipse cx="100" cy="108" rx="20" ry="19" fill="#c084fc" opacity="0.4"/>
  <path d="M 85 100 Q 100 88 115 100 Q 128 112 115 120 Q 100 130 85 120 Q 72 108 85 100" fill="none" stroke="#e9d5ff" stroke-width="1.5" opacity="0.5"/>
  <!-- Sparkles emitting -->
  <text x="148" y="72" font-size="12" fill="#e9d5ff" filter="url(#f)" opacity="0.9">✦</text>
  <text x="36" y="82" font-size="10" fill="#d8b4fe" filter="url(#f)" opacity="0.8">✦</text>
  <text x="155" y="105" font-size="8" fill="#c084fc" filter="url(#f)" opacity="0.7">✦</text>
  <!-- Label -->
  <rect x="50" y="155" width="100" height="32" rx="16" fill="#4c1d95" opacity="0.9"/>
  <text x="100" y="166" font-family="Arial,sans-serif" font-size="10" fill="#d8b4fe" text-anchor="middle">DUST</text>
  <text x="100" y="181" font-family="Georgia,serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">x 200</text>
</svg>
