<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#7a1a1a"/>
      <stop offset="100%" stop-color="#1a0505"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6a00" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff6a00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eye" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#ff8c00"/>
    </radialGradient>
    <filter id="fire"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="sh"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#ff4400" flood-opacity="0.4"/></filter>
  </defs>

  <rect width="300" height="420" fill="url(#bg)"/>

  <!-- Lava cracks -->
  <path d="M 20 380 Q 60 340 40 300 Q 20 260 50 220" stroke="#ff4400" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M 280 380 Q 240 330 260 280 Q 280 240 250 200" stroke="#ff4400" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M 80 400 Q 100 370 90 350" stroke="#ff6600" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M 220 400 Q 200 360 210 340" stroke="#ff6600" stroke-width="1.5" fill="none" opacity="0.4"/>

  <!-- Gold coins on ground -->
  <ellipse cx="90" cy="345" rx="14" ry="8" fill="#d4a000" opacity="0.8"/>
  <ellipse cx="110" cy="355" rx="12" ry="7" fill="#f0b800" opacity="0.7"/>
  <ellipse cx="195" cy="350" rx="13" ry="7" fill="#d4a000" opacity="0.8"/>
  <ellipse cx="215" cy="342" rx="11" ry="6" fill="#f0b800" opacity="0.7"/>
  <ellipse cx="150" cy="358" rx="16" ry="9" fill="#c89000" opacity="0.6"/>

  <!-- Body glow -->
  <ellipse cx="150" cy="230" rx="100" ry="90" fill="url(#glow)"/>

  <!-- Dragon body / tail -->
  <path d="M 195 310 Q 240 290 260 240 Q 270 200 250 175" stroke="#cc2200" stroke-width="18" fill="none" stroke-linecap="round"/>
  <path d="M 250 175 Q 265 155 255 140" stroke="#cc2200" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M 255 140 L 270 125 L 258 135 L 272 120" stroke="#ff4400" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- Dragon wings -->
  <path d="M 150 220 Q 80 170 50 120 Q 80 150 110 190" fill="#8b1500" opacity="0.9"/>
  <path d="M 50 120 Q 40 100 55 85 Q 75 140 110 190" fill="#6a1000" opacity="0.8"/>
  <path d="M 150 220 Q 220 165 255 110 Q 225 145 195 188" fill="#8b1500" opacity="0.9"/>
  <path d="M 255 110 Q 268 90 250 75 Q 228 138 195 188" fill="#6a1000" opacity="0.8"/>

  <!-- Dragon body -->
  <ellipse cx="150" cy="285" rx="58" ry="50" fill="#d42200" filter="url(#sh)"/>
  <!-- Belly scales -->
  <ellipse cx="150" cy="285" rx="35" ry="36" fill="#ff6633" opacity="0.6"/>
  <ellipse cx="150" cy="295" rx="28" ry="25" fill="#ff8855" opacity="0.5"/>

  <!-- Dragon head (chibi big head) -->
  <ellipse cx="150" cy="195" rx="72" ry="68" fill="#e02500" filter="url(#sh)"/>

  <!-- Horns -->
  <path d="M 118 138 Q 108 108 118 92 Q 122 115 128 138" fill="#8b1500"/>
  <path d="M 182 138 Q 192 108 182 92 Q 178 115 172 138" fill="#8b1500"/>
  <!-- Horn highlight -->
  <path d="M 120 138 Q 112 112 120 97" stroke="#cc3300" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M 180 138 Q 188 112 180 97" stroke="#cc3300" stroke-width="2" fill="none" opacity="0.5"/>

  <!-- Nostrils (smoke puff) -->
  <ellipse cx="138" cy="218" rx="8" ry="6" fill="#8b1500"/>
  <ellipse cx="162" cy="218" rx="8" ry="6" fill="#8b1500"/>
  <path d="M 134 212 Q 130 200 126 194" stroke="#aaaaaa" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M 166 212 Q 170 200 174 194" stroke="#aaaaaa" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>

  <!-- Eyes -->
  <ellipse cx="120" cy="185" rx="22" ry="24" fill="white"/>
  <ellipse cx="120" cy="188" rx="16" ry="18" fill="url(#eye)"/>
  <ellipse cx="120" cy="190" rx="9" ry="11" fill="#1a0a00"/>
  <ellipse cx="116" cy="185" r="4" fill="white"/>
  <ellipse cx="180" cy="185" rx="22" ry="24" fill="white"/>
  <ellipse cx="180" cy="188" rx="16" ry="18" fill="url(#eye)"/>
  <ellipse cx="180" cy="190" rx="9" ry="11" fill="#1a0a00"/>
  <ellipse cx="176" cy="185" r="4" fill="white"/>

  <!-- Cute expression -->
  <path d="M 130 218 Q 150 232 170 218" stroke="#8b1500" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Little fangs -->
  <path d="M 135 220 L 132 230 L 138 220" fill="white" opacity="0.9"/>
  <path d="M 165 220 L 162 230 L 168 220" fill="white" opacity="0.9"/>

  <!-- Blush -->
  <ellipse cx="95" cy="205" rx="18" ry="10" fill="rgba(255,120,80,0.35)"/>
  <ellipse cx="205" cy="205" rx="18" ry="10" fill="rgba(255,120,80,0.35)"/>

  <!-- Little fire breath -->
  <path d="M 148 232 Q 145 250 138 258 Q 145 248 150 260 Q 155 248 162 258 Q 155 250 152 232 Z" fill="#ff9a00" opacity="0.7" filter="url(#fire)"/>
  <path d="M 148 232 Q 146 248 142 254 Q 148 245 150 255 Q 152 245 158 254 Q 154 248 152 232 Z" fill="#ffe066" opacity="0.6" filter="url(#fire)"/>

  <!-- Bottom label -->
  <rect x="0" y="360" width="300" height="60" fill="rgba(0,0,0,0.75)"/>
  <rect x="0" y="358" width="300" height="3" fill="#ef4444"/>
  <text x="150" y="387" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">Dragon's Lair</text>
  <text x="150" y="406" font-family="Arial, sans-serif" font-size="11" fill="#fca5a5" text-anchor="middle" letter-spacing="2">GAVELIN CARD CHRONICLES</text>

  <text x="12" y="28" font-size="18" fill="#ef4444" opacity="0.8">🔥</text>
  <text x="268" y="28" font-size="18" fill="#ef4444" opacity="0.8">🔥</text>
</svg>
